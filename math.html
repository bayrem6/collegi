<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathématiques - 8ème année</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f4f7f6;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .dashboard-container {
            background-color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 36px 28px;
            width: 100%;
            max-width: 720px;
            text-align: center;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #555555;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 22px;
            transition: color 0.2s ease;
        }
        .back-btn:hover, .back-btn:active {
            color: #111111;
        }
        h1 {
            color: #111111;
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        p {
            color: #555555;
            font-size: 1.1rem;
            margin-bottom: 32px;
        }
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .subject-card {
            background-color: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 32px 18px;
            text-decoration: none;
            color: #111111;
            transition: all 0.22s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .subject-card i {
            font-size: 2.6rem;
            color: #111111;
            transition: transform 0.22s ease, color 0.22s ease;
        }
        .subject-card span {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .gbre:hover, .gbre:active {
            background-color: #19c2e4;
            border-color: #00c4c4;
            color: #f2fafc;
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(230, 126, 34, 0.35);
        }
        .gbre:hover i, .gbre:active i { color: #ffffff; transform: scale(1.08); }

        .hndse:hover, .hndse:active {
            background-color: #9b59b6;
            border-color: #8e44ad;
            color: #ffffff;
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(155, 89, 182, 0.35);
        }
        .hndse:hover i, .hndse:active i { color: #ffffff; transform: scale(1.08); }

        @media (max-width: 520px) {
            .dashboard-container { padding: 24px 16px; border-radius: 14px; }
            h1 { font-size: 1.7rem; }
            p { font-size: 1rem; margin-bottom: 24px; }
            .subjects-grid { grid-template-columns: 1fr; gap: 14px; }
            .subject-card { padding: 24px 14px; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Retour à l'accueil
        </a>
        <h1>Mathématiques</h1>
        <p>Sélectionnez une branche</p>

        <div class="subjects-grid">
            <a href="gbr.html" class="subject-card gbre">
                <i class="fa-solid fa-arrow-up-1-9"></i>
                <span>Algèbre (جبر)</span>
            </a>
            <a href="hnd.html" class="subject-card hndse">
                <i class="fa-solid fa-shapes"></i>
                <span>Géométrie (هندسة)</span>
            </a>
        </div>
    </div>
</body>
</html>
